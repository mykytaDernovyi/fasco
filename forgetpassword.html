<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Сторінка забули пароль. Відновіть доступ до вашого акаунту FASCO, надіславши код на вашу електронну пошту або номер телефону.">
    <title>Забули пароль - FASCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="icon" href="./assets/images/shop_icon.webp">
    <script type="module" src="./assets/scripts/firebase.js"></script>
    <script type="module" src="./assets/scripts/auth.js"></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <aside class="auth-image-panel">
            <img src="./assets/images/signin.webp" alt="Fashion Model">
        </aside>

        <section class="auth-form-panel">
            <div class="auth-form-content">

                <header class="logo font-title">
                    <a href="index.html">FASCO</a>
                </header>

                <div class="auth-form-block">
                    <h1>Забули пароль</h1>
                    <p class="auth-hint">Введіть email, з яким ви реєструвалися. Ми надішлемо посилання
                        для встановлення нового пароля.</p>

                    <form action="#" method="POST">
                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Електронна пошта" required>
                        </div>

                        <div class="button-group">
                            <button type="submit" class="btn-primary">Надіслати посилання</button>
                        </div>

                        <p class="auth-link">Вже є акаунт? <a href="signin.html">Увійти</a></p>
                    </form>
                </div>

            </div>

            <footer class="auth-footer">
                FASCO Умови та Положення
            </footer>
        </section>
    </main>

</body>

</html>
